name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
      - run: npm run verify

  package:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: self-study-${{ matrix.os }}
          path: out/make/**
          if-no-files-found: error
